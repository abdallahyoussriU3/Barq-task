name: BARQ CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify Docker Compose syntax
        run: docker compose -p barq-assessment config > /tmp/compose-config.txt

      - name: Build and start environment
        run: docker compose -p barq-assessment up --build -d

      - name: Wait for application readiness
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8090/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -p barq-assessment ps
          exit 1

      - name: Verify application containers listen on port 8080
        run: |
          for service in app-01 app-02 app-03; do
            docker compose -p barq-assessment exec -T "$service" \
              python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).read()"
          done

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Run deployment validation
        run: python3 validate.py

      - name: Tear down stack
        if: always()
        run: docker compose -p barq-assessment down
