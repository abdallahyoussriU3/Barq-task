name: barq-assessment
x-app: &app
  build: .
  init: true
  restart: unless-stopped
  env_file: ./config/app.env
  environment: &app-env
    APP_HOST: "0.0.0.0"
    APP_PORT: "8080"
    APP_MESSAGE: "Welcome to BARQ Systems"
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).read()"]
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 10s
  networks: [frontend, backend]
  mem_limit: 512m
  cpus: 0.5
services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-barq_app}
      POSTGRES_DB: ${POSTGRES_DB:-barq_tasks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_please}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-barq_app} -d ${POSTGRES_DB:-barq_tasks}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [backend]
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
  redis:
    image: redis:7.4-alpine
    container_name: redis
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    networks: [backend]
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.25
  app-01:
    <<: *app
    container_name: app-01
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *app-env
      INSTANCE_ID: "app-01"
  app-02:
    <<: *app
    container_name: app-02
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *app-env
      INSTANCE_ID: "app-02"
  nginx:
    image: nginx:1.28-alpine
    container_name: nginx
    ports: ["127.0.0.1:${PUBLIC_PORT:-8080}:80"]
    volumes: ["./nginx/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on:
      app-01:
        condition: service_healthy
      app-02:
        condition: service_healthy
    networks: [frontend]
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.25
networks:
  frontend:
  backend:
    internal: true
volumes:
  postgres-data:
